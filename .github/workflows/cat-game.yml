name: Joanna's cat game

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: cat-game
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, '[cat-game]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Play the move
        env:
          GAME_ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python .github/scripts/cat_game.py

      - name: Save the new board
        run: |
          git config user.name "joanna-cat[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          git commit -m "cat game: update board"
          git push

      - name: Tidy up the game issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}"
