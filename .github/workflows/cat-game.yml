name: Joanna's community cat game

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-game
  cancel-in-progress: false

jobs:
  tally:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Tally the community move
        run: python .github/scripts/cat_game.py

      - name: Update the profile board
        run: |
          git config user.name "joanna-cat[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          git diff --cached --quiet && exit 0
          git commit -m "cat game: tally community move"
          git push
