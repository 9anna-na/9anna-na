<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Joanna Li</title>
  <desc id="desc">A minimal warm pastel profile banner with an original pixel-art cat mascot.</desc>
  <defs>
